services:
  - type: web
    name: pharmacy-app-dnr7
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: |
      ./migrate.sh &&
      gunicorn Apothecary.wsgi:application --bind 0.0.0.0:8000 && python manage.py loaddata data.json
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: pharmacy-app-dnr7.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: pharmacy-db
          property: connectionString
