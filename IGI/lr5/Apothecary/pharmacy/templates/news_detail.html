{% extends 'base_generic.html' %}

{% block title %}{{ news.title }}{% endblock %}

{% block content %}
<h2>{{ news.title }}</h2>

{% if news.image %}
    <img src="{{ news.image.url }}" alt="{{ news.title }}" width="300">
{% endif %}

<p>{{ news.full_text }}</p>

<p><small>Опубликовано: {{ news.publish_date|date:"d.m.Y H:i" }}</small></p>

<p><a href="{% url 'news_list' %}">← К списку новостей</a></p>
{% endblock %}
